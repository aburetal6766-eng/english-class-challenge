<!doctype html>
<html lang="en">
<head>
<title>English Class Challenge! — Presentation Screen</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FFD24A' d='M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
<style>body{overflow:hidden}</style>
</head>
<body>
<div id="root"></div>
<script src="/static/common.js"></script>
<script src="/static/screen-view.js"></script>
<script>
  const view = ECC.Screen(document.getElementById('root'));
  let current = null;
  ECC.connect({ role: 'screen' }, s => { current = s; view.update(s); });

  // Hidden shortcut: press S (or س on an Arabic keyboard) to start the quiz from the lobby.
  // Only the host teacher's session can start it; a small note appears only if something is wrong.
  function note(msg) {
    const n = document.createElement('div');
    n.textContent = msg;
    n.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:99;background:rgba(10,14,53,.92);color:#fff;font:800 15px Nunito,Tajawal,sans-serif;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25)';
    document.body.appendChild(n); setTimeout(() => n.remove(), 2500);
  }
  let starting = false;
  document.addEventListener('keydown', async e => {
    if (e.code !== 'KeyS' || e.ctrlKey || e.metaKey || e.altKey || e.repeat || starting) return;
    if (!current || current.status !== 'lobby') {
      if (current && current.status === 'idle') note('افتحي ردهة المسابقة من لوحة المعلمتين أولًا');
      return;
    }
    starting = true;
    try { await ECC.post('/api/admin/round/start'); view.enableSound && view.enableSound(); }
    catch (err) { note(err.code === 'not_host' ? 'التحكم عند المعلمة الأخرى — انقلي التحكم إليكِ أولًا' : err.message); }
    setTimeout(() => { starting = false; }, 1500);
  });
  document.addEventListener('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); });
</script>
</body>
</html>
