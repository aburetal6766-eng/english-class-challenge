<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>لوحة المعلمتين — English Class Challenge!</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
  body{font-family:'Tajawal','Nunito',system-ui,sans-serif;background:#0E1240}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .top .brand{font-size:30px}
  .who-chip{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1.5px solid var(--line);font-weight:800;font-size:14px}
  .pill.host{background:#FFD24A;color:#2A1A00;border-color:#FFD24A}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tab{background:none;border:0;color:var(--muted);font-weight:800;font-size:16px;padding:12px 16px;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:#fff;border-color:var(--glow-pink)}
  .card{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:20px}
  .card h3{margin:0 0 8px;font-size:17px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid3,.grid2{grid-template-columns:1fr}}
  .btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;background:rgba(255,255,255,.12);color:#fff;border:1.5px solid var(--line);min-height:46px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
  .btn:hover{background:rgba(255,255,255,.2)}
  .btn.pri{background:linear-gradient(135deg,#FF3EA5,#7C3AED);border-color:transparent}
  .btn.go{background:#22C55E;border-color:transparent;color:#05250F;font-size:18px;padding:14px 26px}
  .btn.gold{background:#FFD24A;color:#2A1A00;border-color:transparent}
  .btn.bad{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.6)}
  .btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:14px}
  .warn{background:rgba(255,210,74,.12);border:1.5px solid rgba(255,210,74,.6);color:#FFE7A0;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
  .okbox{background:rgba(34,197,94,.12);border:1.5px solid rgba(34,197,94,.5);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
  .count{border-radius:18px;padding:16px;text-align:center;border:2px solid var(--cls);background:rgba(10,14,53,.5)}
  .count .n{font-family:var(--display);font-size:54px;line-height:1}
  .count .l{font-weight:800;color:var(--cls)}
  input[type=text],input[type=password],input[type=number],textarea,select{font:inherit;font-weight:700;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,14,53,.6);color:#fff;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--glow-pink)}
  input.miss{border-color:#FFD24A;background:rgba(255,210,74,.08)}
  label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
  th{color:var(--muted);font-weight:800}
  .ltr{direction:ltr;text-align:left}
  .qitem{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:rgba(10,14,53,.4)}
  .qitem .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  @media(max-width:700px){.qitem .opts{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:8px;border-radius:12px;padding:4px 8px;background:color-mix(in srgb,var(--opt) 22%,transparent);border:1.5px solid color-mix(in srgb,var(--opt) 60%,transparent)}
  .opt b{font-family:var(--display);width:26px;text-align:center}
  .opt input[type=radio]{width:20px;height:20px;accent-color:#22C55E}
  .modesw{display:inline-flex;border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
  .modesw button{background:none;border:0;color:#fff;font-weight:800;padding:10px 16px}
  .modesw button[aria-pressed="true"]{background:var(--glow-pink)}
  .modesw button.demo[aria-pressed="true"]{background:#FFD24A;color:#2A1A00}
  .login{max-width:420px;margin:8vh auto;display:flex;flex-direction:column;gap:14px}
  .linkbox{display:flex;gap:8px;align-items:center}
  .linkbox code{flex:1;direction:ltr;text-align:left;background:rgba(10,14,53,.6);padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font-family:ui-monospace,monospace;font-size:13px;overflow:auto;white-space:nowrap}
  .status-big{font-size:22px;font-weight:900}
  .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;background:rgba(255,255,255,.12)}
  .tag.demo{background:#FFD24A;color:#2A1A00}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cls)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap" id="root"></div>
<script src="/static/common.js"></script>
<script>
const { esc, CLASSES, LETTERS } = ECC;
const root = document.getElementById('root');
let S = null, tab = 'live', editMode = 'live', drafts = { rosters: null, questions: null }, dirty = { rosters: {}, questions: false };
const STATUS_AR = { idle: 'لا توجد جولة مفتوحة', lobby: 'ردهة الانتظار مفتوحة', intro: 'بدأت المسابقة — استعداد', question: 'السؤال معروض الآن', reveal: 'كشف الإجابة', final: 'انتهت الجولة' };

function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
async function call(url, body, okMsg) { try { await ECC.post(url, body); if (okMsg) toast(okMsg); return true; } catch (e) { toast(e.message === 'not_host' ? 'التحكم بالجولة للمعلمة المضيفة فقط' : e.message); return false; } }

// ------------------------------------------------------------ login
async function boot() {
  const r = await fetch('/events?role=teacher', { method: 'GET' }).catch(() => null);
  if (r && r.status === 401) return renderLogin();
  if (r && r.body) { try { r.body.cancel(); } catch (e) {} }
  ECC.connect({ role: 'teacher' }, s => { S = s; renderAll(); });
}
function renderLogin() {
  root.innerHTML = `<div class="login card">
    <div dir="ltr" class="brand" style="font-size:32px;text-align:center">ENGLISH CLASS CHALLENGE<span class="bang">!</span></div>
    <p class="muted" style="text-align:center;margin:0">دخول لوحة المعلمتين</p>
    <label class="f">المعلمة<select id="lt"><option value="areej">أ. أريج الأمير</option><option value="waad">أ. وعد المرزوق</option></select></label>
    <label class="f">كلمة المرور<input type="password" id="lp" autocomplete="current-password"></label>
    <button class="btn pri" id="lb">دخول</button>
    <p class="muted" id="lerr"></p></div>`;
  const go = async () => {
    try { await ECC.post('/api/login', { teacherId: document.getElementById('lt').value, password: document.getElementById('lp').value }); location.reload(); }
    catch (e) { document.getElementById('lerr').textContent = 'كلمة المرور غير صحيحة'; }
  };
  document.getElementById('lb').onclick = go;
  document.getElementById('lp').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// ------------------------------------------------------------ shell
function renderAll() {
  const me = S.teachers.find(t => t.id === S.me), host = S.teachers.find(t => t.id === S.hostId);
  if (!root.querySelector('#shell')) {
    root.innerHTML = `<div id="shell">
      <div class="top"><div dir="ltr" class="brand">ENGLISH CLASS CHALLENGE<span class="bang">!</span></div>
        <div class="who-chip" id="whochip"></div></div>
      <div class="tabs" role="tablist">
        ${[['live', 'الجولة المباشرة'], ['rosters', 'قوائم الطالبات'], ['questions', 'بنك الأسئلة'], ['certs', 'النتائج والشهادات'], ['settings', 'الإعدادات']].map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}">${l}</button>`).join('')}
      </div><div id="body"></div></div>`;
    root.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderTab(true); } };
  }
  root.querySelector('#whochip').innerHTML = `<span class="pill">${esc(me.label)}</span>${S.hostId === S.me ? '<span class="pill host">أنتِ المضيفة</span>' : `<span class="pill">المضيفة: ${esc(host.label)}</span>`}<button class="btn sm" id="logout">خروج</button>`;
  root.querySelector('#logout').onclick = async () => { await ECC.post('/api/logout'); location.reload(); };
  root.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  renderTab(false);
}
function renderTab(switched) {
  root.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const body = root.querySelector('#body');
  if (tab === 'live') return renderLive(body);
  if (tab === 'certs') return renderCerts(body);
  if (!switched) return; // editors don't re-render on live updates
  if (tab === 'rosters') return renderRosters(body);
  if (tab === 'questions') return renderQuestions(body);
  if (tab === 'settings') return renderSettings(body);
}

function missingEnglish(mode) {
  const out = [];
  for (const c of CLASSES) for (const s of S.modes[mode].rosters[c]) if (!s.english) out.push(`${s.name} (${c})`);
  return out;
}
function modeSwitch() {
  return `<div class="modesw"><button data-mode="live" aria-pressed="${editMode === 'live'}">المسابقة الفعلية</button><button class="demo" data-mode="demo" aria-pressed="${editMode === 'demo'}">الجولة التجريبية</button></div>`;
}

// ------------------------------------------------------------ live tab
function renderLive(body) {
  const isHost = S.hostId === S.me;
  const other = S.teachers.find(t => t.id !== S.me);
  const st = S.status;
  const counts = S.lobbyCounts || {};
  const studentLink = location.origin + '/';
  const roundMode = S.mode;
  const miss = roundMode ? missingEnglish(roundMode) : missingEnglish('live');
  const players = S.players || [];
  const running = ['intro', 'question', 'reveal'].includes(st);
  body.innerHTML = `
    <div class="card"><div class="row" style="justify-content:space-between">
      <div><div class="status-big">${STATUS_AR[st]} ${roundMode === 'demo' ? '<span class="tag demo">جولة تجريبية</span>' : roundMode ? '<span class="tag">المسابقة الفعلية</span>' : ''}</div>
      ${st === 'question' || st === 'reveal' ? `<div class="muted">السؤال ${S.qIndex + 1} من ${S.qTotal} — أجابت ${S.answerCount || 0} من ${S.playerCount || 0}</div>` : ''}</div>
      <div class="row">
        <button class="btn gold" id="openScreen">Open Presentation Screen</button>
      </div></div></div>

    <div class="card"><h2>رابط الطالبات (أرسليه في محادثة Teams)</h2>
      <div class="linkbox"><code id="slink">${esc(studentLink)}</code><button class="btn sm" id="copyLink">نسخ</button></div>
      <p class="muted">لا يحتاج حسابًا ولا رمزًا: تختار الطالبة فصلها ثم اسمها.</p></div>

    <div class="card"><h2>التحكم بالجولة</h2>
      ${isHost ? '' : `<div class="warn" style="margin-bottom:10px">التحكم بالجولة المباشرة الآن عند ${esc(S.teachers.find(t => t.id === S.hostId).label)}. يمكنك الإعداد والمتابعة، أو تولّي التحكم.</div>`}
      <div class="row">
        ${!running && st !== 'lobby' ? `<button class="btn pri" data-open="live" ${isHost ? '' : 'disabled'}>فتح ردهة المسابقة الفعلية</button><button class="btn" data-open="demo" ${isHost ? '' : 'disabled'}>فتح جولة تجريبية</button>` : ''}
        ${st === 'lobby' ? `<button class="btn go" id="start" ${isHost ? '' : 'disabled'}>Start Quiz</button><button class="btn" id="closeRound" ${isHost ? '' : 'disabled'}>إلغاء الردهة</button>` : ''}
        ${running ? `<button class="btn" id="skip" ${isHost ? '' : 'disabled'}>${st === 'question' ? 'إنهاء وقت السؤال الآن' : 'التالي الآن'}</button><button class="btn bad" id="endRound" ${isHost ? '' : 'disabled'}>إنهاء المسابقة وإعلان النتائج</button>` : ''}
        ${st === 'final' ? `<button class="btn" id="closeRound" ${isHost ? '' : 'disabled'}>إغلاق الجولة (تبقى النتائج محفوظة)</button>` : ''}
        <span style="flex:1"></span>
        ${isHost ? `<button class="btn sm" id="handover">نقل التحكم إلى ${esc(other.label)}</button>` : `<button class="btn sm gold" id="takeover">تولّي التحكم</button>`}
      </div>
      ${(st === 'lobby' || st === 'idle') && miss.length ? `<div class="warn" style="margin-top:12px">تنبيه: ${miss.length} طالبة بلا اسم إنجليزي للشهادة: ${esc(miss.slice(0, 8).join('، '))}${miss.length > 8 ? '…' : ''} — أكمليها من «قوائم الطالبات».</div>` : ''}
    </div>

    ${st !== 'idle' ? `<div class="card"><h2>${st === 'lobby' ? 'الطالبات المنتظرات' : 'المشاركات في الجولة'}</h2>
      <div class="grid3">${CLASSES.map(c => `<div class="count cls-${c}"><div class="l">Class ${c}</div><div class="n">${st === 'lobby' ? (counts[c] || 0) : ((S.classes || []).find(x => x.id === c) || {}).joined || 0}</div><div class="muted">${st === 'lobby' ? 'منتظرة' : 'عند البدء'} · <bdi dir="ltr">${ECC.pct(((S.classes || []).find(x => x.id === c) || {}).pct ?? null)}</bdi></div></div>`).join('')}</div>
      <table style="margin-top:12px"><thead><tr><th>الاسم</th><th>الفصل</th><th>الاسم الإنجليزي</th><th>${S.fullRanking ? 'الصحيحة / المركز' : ''}</th><th></th></tr></thead><tbody>
      ${(S.fullRanking ? S.fullRanking.map(p => ({ ...players.find(x => x.sid === p.sid), rk: p })) : players).map(p => `<tr><td>${esc(p.name)}</td><td><span class="dot cls-${p.classId}"></span> ${p.classId}</td><td class="ltr">${p.english ? esc(p.english) : '<span class="tag demo">ناقص</span>'}</td><td>${p.rk ? `${p.rk.correct} · #${p.rk.rank}` : ''}</td>
        <td><button class="btn sm" data-release="${p.sid}" title="إذا اختارت طالبة أخرى هذا الاسم بالخطأ">تحرير الاسم</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">لم تنضم أي طالبة بعد.</td></tr>'}
      </tbody></table></div>` : ''}

    ${st === 'question' || st === 'reveal' ? `<div class="card"><h3 class="ltr">${esc(S.question.text)}</h3><div class="ltr muted">Correct: ${LETTERS[S.correctNow]} — ${esc(S.question.options[S.correctNow])}</div></div>` : ''}
    ${st === 'final' ? `<div class="okbox">الفصل الفائز: ${(S.winners || []).map(c => 'Class ' + c).join(' و ') || '—'} — صدرت الشهادات تلقائيًا. <button class="btn sm" id="toCerts">عرض الشهادات</button></div>` : ''}
  `;
  const $ = s => body.querySelector(s);
  $('#openScreen').onclick = () => window.open('/screen', 'ecc_screen', 'popup,width=1280,height=760');
  $('#copyLink').onclick = () => { navigator.clipboard.writeText(studentLink).then(() => toast('تم نسخ رابط الطالبات')); };
  body.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    const m = b.dataset.open, miss2 = missingEnglish(m);
    if (miss2.length && !confirm(`تنبيه: ${miss2.length} طالبة بلا اسم إنجليزي للشهادة. هل تريدين المتابعة؟`)) return;
    call('/api/admin/round/open', { mode: m });
  });
  if ($('#start')) $('#start').onclick = () => {
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    if (!confirm(`بدء المسابقة الآن مع ${total} طالبة؟ لن تتمكن طالبات جديدات من الانضمام بعد البدء.`)) return;
    call('/api/admin/round/start');
  };
  if ($('#skip')) $('#skip').onclick = () => call('/api/admin/round/skip');
  if ($('#endRound')) $('#endRound').onclick = () => { if (confirm('إنهاء المسابقة الآن وإعلان النتائج؟')) call('/api/admin/round/end'); };
  if ($('#closeRound')) $('#closeRound').onclick = () => { if (confirm('إغلاق الجولة؟')) call('/api/admin/round/close'); };
  if ($('#handover')) $('#handover').onclick = () => { if (confirm(`نقل التحكم إلى ${other.label}؟`)) call('/api/admin/host', { teacherId: other.id }, 'تم نقل التحكم'); };
  if ($('#takeover')) $('#takeover').onclick = () => { if (confirm('تولّي التحكم بالجولة المباشرة؟')) call('/api/admin/host', { teacherId: S.me }, 'أصبحتِ المضيفة'); };
  if ($('#toCerts')) $('#toCerts').onclick = () => { tab = 'certs'; renderTab(true); };
  body.querySelectorAll('[data-release]').forEach(b => b.onclick = () => { if (confirm('تحرير هذا الاسم حتى تختاره صاحبته من جهازها؟')) call('/api/admin/round/release', { sid: b.dataset.release }, 'تم تحرير الاسم'); });
}

// ------------------------------------------------------------ rosters
function renderRosters(body) {
  drafts.rosters = JSON.parse(JSON.stringify(S.modes[editMode].rosters));
  dirty.rosters = {};
  body.innerHTML = `<div class="row" style="margin-bottom:12px">${modeSwitch()}<span class="muted">${editMode === 'demo' ? 'أسماء وهمية للجولة التجريبية — منفصلة عن المسابقة الفعلية.' : 'تُحفظ القوائم لاستخدامها في الجولات اللاحقة.'}</span></div>
    ${CLASSES.map(c => `<div class="card cls-${c}" data-class="${c}"></div>`).join('')}`;
  body.querySelector('.modesw').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) { editMode = b.dataset.mode; renderRosters(body); } };
  CLASSES.forEach(c => renderClassRoster(body.querySelector(`[data-class="${c}"]`), c));
}
function renderClassRoster(el, c) {
  const list = drafts.rosters[c];
  const miss = list.filter(s => !s.english).length;
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0"><span class="dot"></span> Class ${c} <span class="muted">(${list.length} طالبة)</span></h2>
      <div class="row">${miss ? `<span class="tag demo">${miss} بلا اسم إنجليزي</span>` : ''}<button class="btn pri sm" data-save>حفظ قائمة ${c}</button></div></div>
    <details style="margin:10px 0"><summary style="cursor:pointer;font-weight:800">لصق قائمة دفعة واحدة</summary>
      <p class="muted">سطر لكل طالبة: <b>الاسم كما يظهر في القائمة | الاسم بالإنجليزية للشهادة | اسم العرض (اختياري)</b>. يمكن الفصل بعلامة | أو Tab (مثل اللصق من Excel).</p>
      <textarea rows="5" data-paste placeholder="سارة أحمد العتيبي | Sarah Ahmed Alotaibi&#10;نورة خالد | Noura Khalid | Noura K."></textarea>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-addpaste>إضافة إلى القائمة</button><button class="btn sm bad" data-replacepaste>استبدال القائمة كاملة</button></div></details>
    <div style="overflow:auto"><table><thead><tr><th>#</th><th>الاسم في القائمة</th><th>الاسم بالإنجليزية (للشهادة)</th><th>اسم العرض على الشاشة</th><th></th></tr></thead><tbody>
      ${list.map((s, i) => `<tr><td>${i + 1}</td><td><input type="text" data-i="${i}" data-f="name" value="${esc(s.name)}"></td>
        <td><input type="text" class="ltr ${s.english ? '' : 'miss'}" data-i="${i}" data-f="english" value="${esc(s.english)}" placeholder="English name"></td>
        <td><input type="text" class="ltr" data-i="${i}" data-f="display" value="${esc(s.display)}" placeholder="تلقائي: ${esc(autoShort(s))}"></td>
        <td><button class="btn sm bad" data-del="${i}" aria-label="حذف">حذف</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">لا توجد أسماء بعد.</td></tr>'}
    </tbody></table></div>
    <button class="btn sm" data-addrow style="margin-top:8px">+ إضافة طالبة</button>`;
  const mark = () => { dirty.rosters[c] = true; };
  el.oninput = e => { const t = e.target; if (t.dataset.f) { list[+t.dataset.i][t.dataset.f] = t.value; mark(); if (t.dataset.f === 'english') t.classList.toggle('miss', !t.value.trim()); } };
  el.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.del !== undefined) { list.splice(+b.dataset.del, 1); mark(); renderClassRoster(el, c); }
    if (b.hasAttribute('data-addrow')) { list.push({ id: '', name: '', english: '', display: '' }); mark(); renderClassRoster(el, c); el.querySelectorAll('input[data-f=name]')[list.length - 1].focus(); }
    if (b.hasAttribute('data-addpaste') || b.hasAttribute('data-replacepaste')) {
      const rows = parsePaste(el.querySelector('[data-paste]').value);
      if (!rows.length) return toast('لا توجد أسماء في النص');
      if (b.hasAttribute('data-replacepaste')) { if (!confirm('استبدال القائمة الحالية كاملة؟')) return; list.length = 0; }
      list.push(...rows); mark(); renderClassRoster(el, c); toast(`أضيفت ${rows.length} طالبة — اضغطي «حفظ»`);
    }
    if (b.hasAttribute('data-save')) {
      const clean = list.filter(s => s.name.trim());
      if (await call('/api/admin/roster', { mode: editMode, classId: c, students: clean }, `تم حفظ قائمة Class ${c}`)) {
        dirty.rosters[c] = false;
        setTimeout(() => { drafts.rosters[c] = JSON.parse(JSON.stringify(S.modes[editMode].rosters[c])); renderClassRoster(el, c); }, 300);
      }
    }
  };
}
function autoShort(s) { return (s.english || '').trim() || (s.name || '').trim().split(/\s+/).filter(w => w !== 'بنت' && w !== 'بن').slice(0, 2).join(' '); }
function parsePaste(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split(/\t|\|/).map(x => x.trim());
    return { id: '', name: parts[0] || '', english: parts[1] || '', display: parts[2] || '' };
  }).filter(s => s.name);
}

// ------------------------------------------------------------ questions
function renderQuestions(body) {
  drafts.questions = JSON.parse(JSON.stringify(S.modes[editMode].questions));
  body.innerHTML = `<div class="row" style="margin-bottom:12px">${modeSwitch()}<span class="muted">أربعة خيارات لكل سؤال، وإجابة صحيحة واحدة. الأسئلة تظهر بالترتيب.</span></div><div id="qlist"></div>`;
  body.querySelector('.modesw').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) { editMode = b.dataset.mode; renderQuestions(body); } };
  drawQ(body.querySelector('#qlist'));
}
function drawQ(el) {
  const qs = drafts.questions;
  el.innerHTML = `<div class="row" style="margin-bottom:10px;justify-content:space-between"><b>${qs.length} سؤال · ${qs.length * S.settings.questionSeconds} ثانية تقريبًا</b><button class="btn pri" data-saveq>حفظ بنك الأسئلة</button></div>
    ${qs.map((q, i) => `<div class="qitem" data-qi="${i}">
      <div class="row"><b style="font-family:var(--display);font-size:22px">${String(i + 1).padStart(2, '0')}</b>
        <input type="text" class="ltr" style="flex:1" data-f="text" value="${esc(q.text)}" placeholder="Question in English">
        <button class="btn sm" data-up ${i ? '' : 'disabled'} aria-label="أعلى">↑</button><button class="btn sm" data-down ${i < qs.length - 1 ? '' : 'disabled'} aria-label="أسفل">↓</button><button class="btn sm bad" data-delq>حذف</button></div>
      <div class="opts ltr">${[0, 1, 2, 3].map(k => `<label class="opt opt${LETTERS[k]}"><b>${LETTERS[k]}</b><input type="text" data-o="${k}" value="${esc(q.options[k])}" placeholder="Option ${LETTERS[k]}"><input type="radio" name="c${i}" data-c="${k}" ${q.correct === k ? 'checked' : ''} aria-label="الإجابة الصحيحة ${LETTERS[k]}"></label>`).join('')}</div>
    </div>`).join('')}
    <button class="btn" data-addq>+ إضافة سؤال</button>`;
  el.oninput = e => {
    const it = e.target.closest('[data-qi]'); if (!it) return; const q = qs[+it.dataset.qi];
    if (e.target.dataset.f) q.text = e.target.value;
    if (e.target.dataset.o !== undefined) q.options[+e.target.dataset.o] = e.target.value;
    if (e.target.dataset.c !== undefined) q.correct = +e.target.dataset.c;
  };
  el.onchange = el.oninput;
  el.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    const it = b.closest('[data-qi]'); const i = it ? +it.dataset.qi : -1;
    if (b.hasAttribute('data-up')) { [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; drawQ(el); }
    if (b.hasAttribute('data-down')) { [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; drawQ(el); }
    if (b.hasAttribute('data-delq')) { if (confirm('حذف هذا السؤال؟')) { qs.splice(i, 1); drawQ(el); } }
    if (b.hasAttribute('data-addq')) { qs.push({ id: '', text: '', options: ['', '', '', ''], correct: 0 }); drawQ(el); }
    if (b.hasAttribute('data-saveq')) {
      const bad = qs.findIndex(q => !q.text.trim() || q.options.some(o => !o.trim()));
      if (bad >= 0 && !confirm(`السؤال ${bad + 1} غير مكتمل وسيُتجاوز في الجولة. هل تحفظين؟`)) return;
      call('/api/admin/questions', { mode: editMode, questions: qs }, 'تم حفظ بنك الأسئلة');
    }
  };
}

// ------------------------------------------------------------ results & certificates
function renderCerts(body) {
  const rs = S.results || [];
  if (body.dataset.sig === JSON.stringify(rs.map(r => r.id))) return;
  body.dataset.sig = JSON.stringify(rs.map(r => r.id));
  body.innerHTML = rs.length ? rs.map(r => `<div class="card">
    <div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${new Date(r.startedAt).toLocaleString('ar-SA-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' })} ${r.mode === 'demo' ? '<span class="tag demo">تجريبية</span>' : '<span class="tag">فعلية</span>'}</h2>
      <div class="muted">الفصل الفائز: ${r.winners.map(c => 'Class ' + c).join(' و ') || '—'} · ${r.classes.map(c => `${c.id}: ${ECC.pct(c.pct)}`).join(' · ')} · ${r.questionCount} سؤال</div></div>
      <div class="row"><a class="btn gold" href="/api/admin/certs.zip?round=${r.id}">Download All Certificates</a><button class="btn sm bad" data-delres="${r.id}">حذف النتيجة</button></div></div>
    <div class="grid2" style="margin-top:12px">
      <div><h3>Top 10</h3><table><tbody>${r.top10.map(p => `<tr><td>${p.rank}</td><td>${esc(p.name)}</td><td><span class="dot cls-${p.classId}"></span> ${p.classId}</td><td>${p.correct} صحيحة</td><td class="muted">${(p.timeMs / 1000).toFixed(1)} ث</td></tr>`).join('')}</tbody></table></div>
      <div><h3>الشهادات (${r.certs.length})</h3><div style="max-height:360px;overflow:auto"><table><tbody>${r.certs.map(c => `<tr><td>${esc(c.name)}<div class="muted ltr">${esc(c.englishName) || '<span class="tag demo">بلا اسم إنجليزي</span>'}</div></td><td>${c.type === 'achievement' ? 'تميّز #' + c.rank : 'الفصل الفائز'}</td><td class="ltr muted">${c.code}</td><td><button class="btn sm" data-copy="/c/${c.token}">نسخ رابطها</button></td></tr>`).join('')}</tbody></table></div></div>
    </div></div>`).join('') : '<div class="card muted">لا توجد نتائج بعد. تظهر هنا الشهادات تلقائيًا فور نهاية كل جولة.</div>';
  body.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.copy) navigator.clipboard.writeText(location.origin + b.dataset.copy).then(() => toast('تم نسخ رابط صفحة الشهادة الخاصة'));
    if (b.dataset.delres && confirm('حذف هذه النتيجة وشهاداتها نهائيًا؟')) call('/api/admin/results/delete', { id: b.dataset.delres }).then(() => { body.dataset.sig = ''; });
  };
}

// ------------------------------------------------------------ settings
function renderSettings(body) {
  const s = S.settings;
  body.innerHTML = `<div class="grid2">
    <div class="card"><h2>الأسماء الرسمية على الشهادات (بالإنجليزية)</h2>
      <label class="f">English Teacher 1<input type="text" class="ltr" id="t1" value="${esc(s.teacher1)}"></label><br>
      <label class="f">English Teacher 2<input type="text" class="ltr" id="t2" value="${esc(s.teacher2)}"></label><br>
      <label class="f">School Principal<input type="text" class="ltr" id="pr" value="${esc(s.principal)}"></label><br>
      <label class="f">اسم المسابقة<input type="text" class="ltr" id="cn" value="${esc(s.compName)}"></label></div>
    <div class="card"><h2>توقيت المسابقة</h2>
      <label class="f">مدة السؤال (ثانية)<input type="number" id="qs" min="5" max="120" value="${s.questionSeconds}"></label><br>
      <label class="f">وقفة كشف الإجابة قبل السؤال التالي (ثانية)<input type="number" id="rs" min="2" max="30" value="${s.revealSeconds}"></label>
      <p class="muted">يُحسب الوقت من الخادم ويظهر موحّدًا لكل الأجهزة.</p></div>
  </div>
  <button class="btn pri" id="saveSet">حفظ الإعدادات</button>
  <div class="grid2" style="margin-top:14px">
    <div class="card"><h2>تغيير كلمة مروري</h2><label class="f">كلمة المرور الجديدة (6 أحرف على الأقل)<input type="password" id="np" autocomplete="new-password"></label><br><button class="btn" id="savePw">تغيير</button></div>
    <div class="card"><h2>نسخة احتياطية</h2><p class="muted">حمّلي نسخة من القوائم والأسئلة والنتائج، واستعيديها عند الحاجة (مثلًا بعد نقل الخادم).</p>
      <div class="row"><a class="btn" href="/api/admin/backup">تنزيل نسخة احتياطية</a><label class="btn">استعادة من ملف<input type="file" id="restore" accept="application/json" hidden></label></div></div>
  </div>`;
  const v = id => body.querySelector('#' + id).value;
  body.querySelector('#saveSet').onclick = () => call('/api/admin/settings', { teacher1: v('t1'), teacher2: v('t2'), principal: v('pr'), compName: v('cn'), questionSeconds: +v('qs'), revealSeconds: +v('rs') }, 'تم حفظ الإعدادات');
  body.querySelector('#savePw').onclick = () => call('/api/admin/password', { password: v('np') }, 'تم تغيير كلمة المرور');
  body.querySelector('#restore').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm('ستستبدل الاستعادة البيانات الحالية. متابعة؟')) return;
    try { await call('/api/admin/restore', JSON.parse(await f.text()), 'تمت الاستعادة'); } catch (err) { toast('ملف غير صالح'); }
  };
}

window.addEventListener('beforeunload', e => { if (Object.values(dirty.rosters).some(Boolean)) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
</body>
