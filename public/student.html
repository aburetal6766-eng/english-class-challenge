<!doctype html>
<html lang="en">
<head>
<title>English Class Challenge!</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FFD24A' d='M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="root"></div>
<script src="/static/common.js"></script>
<script src="/static/screen-view.js"></script>
<script src="/static/student-view.js"></script>
<script>
(function () {
  const KEY = 'ecc_student_token';
  let token = '';
  try { token = localStorage.getItem(KEY) || ''; } catch (e) {}
  if (!token) { token = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem(KEY, token); } catch (e) {} }
  const api = {
    join: (classId, sid) => ECC.post('/api/student/join', { classId, sid, token }),
    leave: () => ECC.post('/api/student/leave', { token }),
    answer: (qIndex, choice) => ECC.post('/api/student/answer', { token, qIndex, choice })
  };
  const view = ECC.Student(document.getElementById('root'), api);
  ECC.connect({ role: 'student', token }, s => view.update(s), ok => view.online(ok));
})();
</script>
</body>
</html>
